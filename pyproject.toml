[project]
name = "tjgif"
version = "0.1.0"
description = "《猫和老鼠》语义搜片动图生成器"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scenedetect",
    "pillow",
    "tqdm",
    "pandas",
    "pyyaml",
]

[project.scripts]
tjgif = "tjgif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tjgif"]
